<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ป้ายบอกทาง</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Kanit:wght@500;700&display=swap');

  :root{
    --sky-top:#101a26;
    --sky-bot:#25384a;
    --pole:#3d3226;
    --pole-light:#5a4a35;
    --sign:#d9a441;
    --sign-dark:#b9822c;
    --sign-text:#2b1f10;
    --coral:#e8735c;
    --star:#f4e9c9;
    --ground:#182a24;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Prompt', sans-serif;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bot) 55%, var(--ground) 100%);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* stars */
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .bg-image-layer{
    position:fixed; inset:0; z-index:1;
    background-size:cover; background-position:center; background-repeat:no-repeat;
    display:none;
  }
  .bg-image-layer.show{ display:block; }
  .bg-image-layer::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,16,24,.55), rgba(10,16,24,.75));
  }
  .star{
    position:absolute; width:2px; height:2px; background:var(--star);
    border-radius:50%; opacity:.7;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.2;} 50%{opacity:.9;} }

  header{
    position:relative; z-index:2;
    text-align:center;
    padding:48px 20px 8px;
  }
  header h1{
    font-family:'Kanit', sans-serif;
    color:var(--star);
    font-size:clamp(26px,5vw,40px);
    margin:0 0 6px;
    letter-spacing:.5px;
  }
  header p{
    color:#9fb3c4;
    margin:0;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .yard{
    position:relative; z-index:2;
    flex:1;
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 30px;
  }

  .pole{
    width:22px;
    background:linear-gradient(90deg,var(--pole-light),var(--pole) 60%);
    border-radius:3px;
    box-shadow:2px 0 6px rgba(0,0,0,.4) inset;
    align-self:center;
  }
  .pole-top{ height:26px; }
  .pole-bottom{ height:60px; }

  .signs{
    display:flex;
    flex-direction:column;
    width:100%;
    gap:14px;
  }

  .sign-row{
    display:flex;
    align-items:center;
    position:relative;
  }
  .sign-row.left{ justify-content:flex-start; }
  .sign-row.right{ justify-content:flex-end; }

  .sign-plate{
    --tip:16px;
    position:relative;
    background:linear-gradient(180deg,var(--sign),var(--sign-dark));
    color:var(--sign-text);
    border:3px solid #3d3226;
    padding:14px 22px;
    max-width:78%;
    min-width:180px;
    text-decoration:none;
    font-weight:600;
    font-size:16px;
    box-shadow:3px 4px 0 rgba(0,0,0,.35);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .sign-plate .num{
    font-family:'Kanit',sans-serif;
    font-weight:700;
    font-size:12px;
    background:var(--sign-text);
    color:var(--sign);
    width:22px; height:22px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    overflow:hidden;
  }
  .sign-plate .num img{
    width:100%; height:100%; object-fit:cover;
  }
  .sign-plate .label{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .sign-row.left .sign-plate{
    border-radius:4px 14px 14px 4px;
    padding-right:34px;
  }
  .sign-row.left .sign-plate::after{
    content:'';
    position:absolute; right:-15px; top:50%; transform:translateY(-50%);
    border-top:22px solid transparent;
    border-bottom:22px solid transparent;
    border-left:15px solid var(--sign-dark);
  }
  .sign-row.right .sign-plate{
    border-radius:14px 4px 4px 14px;
    padding-left:34px;
    flex-direction:row-reverse;
  }
  .sign-row.right .sign-plate::before{
    content:'';
    position:absolute; left:-15px; top:50%; transform:translateY(-50%);
    border-top:22px solid transparent;
    border-bottom:22px solid transparent;
    border-right:15px solid var(--sign-dark);
  }

  /* shape: round pill (no pointer) */
  .signs.shape-round .sign-plate{
    border-radius:30px !important;
    padding-left:22px !important;
    padding-right:22px !important;
  }
  .signs.shape-round .sign-plate::before,
  .signs.shape-round .sign-plate::after{ content:none; }

  /* shape: ribbon notch */
  .signs.shape-ribbon .sign-row.left .sign-plate{
    border-radius:4px !important;
    padding-right:28px !important;
    clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
  }
  .signs.shape-ribbon .sign-row.left .sign-plate::after{ content:none; }
  .signs.shape-ribbon .sign-row.right .sign-plate{
    border-radius:4px !important;
    padding-left:28px !important;
    clip-path: polygon(10% 0, 100% 0, 100% 100%, 10% 100%, 0 50%);
  }
  .signs.shape-ribbon .sign-row.right .sign-plate::before{ content:none; }

  .sign-plate:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:4px 6px 0 rgba(0,0,0,.4);
    filter:brightness(1.08);
    border-color:var(--coral);
  }
  .sign-plate:active{
    transform:translateY(0) scale(.99);
  }

  .base{
    width:120px; height:16px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.5), transparent 70%);
    margin-top:-4px;
  }

  footer{
    position:relative; z-index:2;
    padding:10px 20px 26px;
  }
  .gear-btn{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:5;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:#9fb3c4;
    border-radius:20px;
    padding:9px 18px;
    font-size:13px;
    font-family:'Prompt',sans-serif;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:background .15s ease, color .15s ease;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
  }
  .gear-btn:hover{ background:rgba(255,255,255,.16); color:var(--star); }

  /* Admin panel */
  .overlay{
    position:fixed; inset:0; background:rgba(10,15,20,.72);
    display:none; align-items:center; justify-content:center;
    z-index:10; padding:20px;
  }
  .overlay.show{ display:flex; }
  .panel{
    background:#1b2733;
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
    width:100%; max-width:460px;
    max-height:86vh;
    overflow-y:auto;
    padding:22px 20px 20px;
  }
  .panel h2{
    color:var(--star);
    font-family:'Kanit',sans-serif;
    margin:0 0 4px;
    font-size:20px;
  }
  .panel .sub{
    color:#7f93a3; font-size:13px; margin:0 0 18px;
  }
  .field-group{
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
  }
  .field-group label{
    display:block;
    color:#9fb3c4;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:4px;
  }
  .field-group input{
    width:100%;
    background:#101a24;
    border:1px solid rgba(255,255,255,.12);
    color:var(--star);
    padding:9px 10px;
    border-radius:6px;
    font-family:'Prompt',sans-serif;
    font-size:14px;
    margin-bottom:8px;
  }
  .field-group input:focus{
    outline:none; border-color:var(--coral);
  }
  .panel-actions{
    display:flex; gap:10px; margin-top:16px;
  }
  .btn{
    flex:1;
    padding:11px;
    border-radius:8px;
    border:none;
    font-family:'Prompt',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .btn:hover{ opacity:.88; }
  .btn-save{ background:var(--coral); color:#fff; }
  .btn-close{ background:rgba(255,255,255,.08); color:var(--star); }
  .status-msg{
    text-align:center; font-size:12px; color:#7fc99a; height:16px; margin-top:8px;
  }

  /* image upload controls */
  .img-row{
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
  }
  .thumb{
    width:40px; height:40px; border-radius:8px; object-fit:cover;
    border:1px solid rgba(255,255,255,.15); background:#101a24; flex-shrink:0;
  }
  .thumb-empty{
    display:flex; align-items:center; justify-content:center;
    color:#5a6b78; font-size:10px;
  }
  .file-input-wrap{
    flex:1; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .upload-btn{
    background:var(--coral);
    color:#fff;
    padding:9px 14px;
    border-radius:8px;
    font-size:12px;
    font-family:'Prompt',sans-serif;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .upload-btn:active{ opacity:.85; }
  .visually-hidden-file{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .mini-btn{
    background:rgba(255,255,255,.08); color:#e8735c; border:none;
    border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer;
    font-family:'Prompt',sans-serif; flex-shrink:0;
  }
  .mini-btn:hover{ background:rgba(255,255,255,.15); }
  .hint{ color:#5a6b78; font-size:11px; margin:2px 0 10px; }

  /* lock screen */
  .lock-panel{
    background:#1b2733; border:1px solid rgba(255,255,255,.1);
    border-radius:16px; width:100%; max-width:340px; padding:26px 22px;
    text-align:center;
  }
  .lock-panel h2{
    color:var(--star); font-family:'Kanit',sans-serif; margin:0 0 4px; font-size:19px;
  }
  .lock-panel p{ color:#7f93a3; font-size:13px; margin:0 0 16px; }
  .lock-panel input{
    width:100%; background:#101a24; border:1px solid rgba(255,255,255,.12);
    color:var(--star); padding:11px 12px; border-radius:8px;
    font-family:'Prompt',sans-serif; font-size:15px; text-align:center;
    letter-spacing:2px; margin-bottom:10px;
  }
  .lock-panel input:focus{ outline:none; border-color:var(--coral); }
  .lock-err{ color:#e8735c; font-size:12px; height:16px; margin-bottom:6px; }
</style>
</head>
<body>

<div class="bg-image-layer" id="bgImageLayer"></div>
<div class="stars" id="stars"></div>

<header>
  <h1 id="siteTitle">ป้ายบอกทาง</h1>
  <p id="siteSubtitle">เลือกทางที่จะไป</p>
</header>

<div class="yard">
  <div class="pole pole-top"></div>
  <div class="signs" id="signs"></div>
  <div class="pole pole-bottom"></div>
  <div class="base"></div>
</div>

<button class="gear-btn" id="openAdmin">แอดมิน</button>

<div class="overlay" id="lockOverlay">
  <div class="lock-panel">
    <h2>🔒 เข้าสู่หลังบ้าน</h2>
    <p>กรอกรหัสผ่านเพื่อแก้ไขป้าย</p>
    <input type="password" id="lockInput" placeholder="รหัสผ่าน" inputmode="numeric">
    <div class="lock-err" id="lockErr"></div>
    <div class="panel-actions">
      <button class="btn btn-close" id="lockCancel">ยกเลิก</button>
      <button class="btn btn-save" id="lockSubmit">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2>ตั้งค่าป้ายบอกทาง</h2>
    <p class="sub">ใส่ชื่อป้ายและลิงก์ที่ต้องการให้กดแล้วไปถึง</p>

    <div class="field-group" id="styleGroup">
      <label>ชื่อหัวข้อหลัก</label>
      <input type="text" id="titleInput" placeholder="ป้ายบอกทาง">
      <label>คำโปรย</label>
      <input type="text" id="subtitleInput" placeholder="เลือกทางที่จะไป">

      <label>รูปแบบป้าย</label>
      <select id="shapeSelect" style="width:100%;background:#101a24;border:1px solid rgba(255,255,255,.12);color:#f4e9c9;padding:9px 10px;border-radius:6px;font-family:'Prompt',sans-serif;font-size:14px;margin-bottom:10px;">
        <option value="arrow">ลูกศร (แบบเดิม)</option>
        <option value="round">แคปซูลมน</option>
        <option value="ribbon">ริบบิ้นบาก</option>
      </select>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <div style="flex:1;min-width:110px;">
          <label>สีท้องฟ้าบน</label>
          <input type="color" id="colorBgTop" style="height:36px;padding:2px;">
        </div>
        <div style="flex:1;min-width:110px;">
          <label>สีท้องฟ้าล่าง</label>
          <input type="color" id="colorBgBot" style="height:36px;padding:2px;">
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
        <div style="flex:1;min-width:110px;">
          <label>สีป้าย</label>
          <input type="color" id="colorSign" style="height:36px;padding:2px;">
        </div>
        <div style="flex:1;min-width:110px;">
          <label>สีตัวอักษรบนป้าย</label>
          <input type="color" id="colorText" style="height:36px;padding:2px;">
        </div>
        <div style="flex:1;min-width:110px;">
          <label>สีเน้น (ตอนชี้เมาส์)</label>
          <input type="color" id="colorAccent" style="height:36px;padding:2px;">
        </div>
      </div>

      <label style="margin-top:10px;">รูปพื้นหลัง</label>
      <div class="img-row">
        <img class="thumb" id="bgThumb" style="display:none;">
        <div class="thumb thumb-empty" id="bgThumbEmpty">ไม่มี</div>
        <div class="file-input-wrap">
          <label class="upload-btn" for="bgFileInput">📁 เลือกรูปจากเครื่อง</label>
          <input type="file" id="bgFileInput" accept="image/*" class="visually-hidden-file">
          <button class="mini-btn" id="bgRemoveBtn" type="button">ลบ</button>
        </div>
      </div>
      <p class="hint">ถ้าอัปโหลดรูป จะใช้แทนสีพื้นหลังด้านบน</p>

      <label>เปลี่ยนรหัสผ่านหลังบ้าน</label>
      <input type="password" id="newPassword" placeholder="เว้นว่าง = ไม่เปลี่ยนรหัส">
    </div>

    <div id="fields"></div>
    <div class="panel-actions">
      <button class="btn btn-close" id="closeAdmin">ปิด</button>
      <button class="btn btn-save" id="saveAdmin">บันทึก</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'signpost:data';
const DEFAULT_SIGNS = [
  { label: 'ป้ายที่ 1', url: 'https://www.google.com', image: null },
  { label: 'ป้ายที่ 2', url: 'https://www.facebook.com', image: null },
  { label: 'ป้ายที่ 3', url: 'https://www.youtube.com', image: null },
  { label: 'ป้ายที่ 4', url: 'https://www.instagram.com', image: null },
  { label: 'ป้ายที่ 5', url: 'https://line.me', image: null },
  { label: 'ป้ายที่ 6', url: 'https://www.tiktok.com', image: null }
];
const DEFAULT_SETTINGS = {
  title: 'ป้ายบอกทาง',
  subtitle: 'เลือกทางที่จะไป',
  bgTop: '#101a26',
  bgBot: '#25384a',
  sign: '#d9a441',
  text: '#2b1f10',
  accent: '#e8735c',
  shape: 'arrow',
  bgImage: null,
  password: '1234'
};

let signs = DEFAULT_SIGNS.map(s => ({...s}));
let settings = {...DEFAULT_SETTINGS};
let unlocked = false;

function darken(hex, amt){
  hex = (hex || '#000000').replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  let r = (num >> 16) - amt, g = ((num >> 8) & 0xff) - amt, b = (num & 0xff) - amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function fileToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else{ width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('อ่านรูปไม่สำเร็จ'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.readAsDataURL(file);
  });
}

function applySettings(){
  document.getElementById('siteTitle').textContent = settings.title || DEFAULT_SETTINGS.title;
  document.getElementById('siteSubtitle').textContent = settings.subtitle || DEFAULT_SETTINGS.subtitle;
  const root = document.documentElement.style;
  root.setProperty('--sky-top', settings.bgTop);
  root.setProperty('--sky-bot', settings.bgBot);
  root.setProperty('--ground', darken(settings.bgBot, 25));
  root.setProperty('--sign', settings.sign);
  root.setProperty('--sign-dark', darken(settings.sign, 35));
  root.setProperty('--sign-text', settings.text);
  root.setProperty('--coral', settings.accent);
  document.getElementById('signs').className = 'signs shape-' + settings.shape;

  const bgLayer = document.getElementById('bgImageLayer');
  if(settings.bgImage){
    bgLayer.style.backgroundImage = `url('${settings.bgImage}')`;
    bgLayer.classList.add('show');
  }else{
    bgLayer.style.backgroundImage = '';
    bgLayer.classList.remove('show');
  }
}

function fillStyleInputs(){
  document.getElementById('titleInput').value = settings.title || '';
  document.getElementById('subtitleInput').value = settings.subtitle || '';
  document.getElementById('shapeSelect').value = settings.shape;
  document.getElementById('colorBgTop').value = settings.bgTop;
  document.getElementById('colorBgBot').value = settings.bgBot;
  document.getElementById('colorSign').value = settings.sign;
  document.getElementById('colorText').value = settings.text;
  document.getElementById('colorAccent').value = settings.accent;
  document.getElementById('newPassword').value = '';
  refreshBgThumb();
}

function refreshBgThumb(){
  const thumb = document.getElementById('bgThumb');
  const empty = document.getElementById('bgThumbEmpty');
  if(settings.bgImage){
    thumb.src = settings.bgImage;
    thumb.style.display = 'block';
    empty.style.display = 'none';
  }else{
    thumb.style.display = 'none';
    empty.style.display = 'flex';
  }
}

function makeStars(){
  const wrap = document.getElementById('stars');
  const n = 60;
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*60 + '%';
    s.style.animationDelay = (Math.random()*3) + 's';
    wrap.appendChild(s);
  }
}

function normalizeUrl(u){
  if(!u) return '#';
  u = u.trim();
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

function renderSigns(){
  const wrap = document.getElementById('signs');
  wrap.innerHTML = '';
  signs.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'sign-row ' + (i % 2 === 0 ? 'left' : 'right');
    const a = document.createElement('a');
    a.className = 'sign-plate';
    a.href = normalizeUrl(s.url);
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    const iconHtml = s.image
      ? `<span class="num"><img src="${s.image}" alt=""></span>`
      : '';
    a.innerHTML = `${iconHtml}<span class="label">${escapeHtml(s.label || 'ป้ายที่ ' + (i+1))}</span>`;
    row.appendChild(a);
    wrap.appendChild(row);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderFields(){
  const wrap = document.getElementById('fields');
  wrap.innerHTML = '';
  signs.forEach((s, i) => {
    const fg = document.createElement('div');
    fg.className = 'field-group';
    fg.innerHTML = `
      <label>ชื่อป้าย ${i+1}</label>
      <input type="text" data-idx="${i}" data-field="label" value="${escapeHtml(s.label)}" placeholder="ชื่อป้าย">
      <label>ลิงก์ URL</label>
      <input type="text" data-idx="${i}" data-field="url" value="${escapeHtml(s.url)}" placeholder="https://example.com">
      <label>รูปไอคอนป้าย</label>
      <div class="img-row">
        <img class="thumb" data-thumb="${i}" style="display:${s.image ? 'block' : 'none'};" src="${s.image || ''}">
        <div class="thumb thumb-empty" data-thumb-empty="${i}" style="display:${s.image ? 'none' : 'flex'};">ไม่มี</div>
        <div class="file-input-wrap">
          <label class="upload-btn" for="signFile${i}">📁 เลือกรูปจากเครื่อง</label>
          <input type="file" id="signFile${i}" accept="image/*" class="visually-hidden-file" data-sign-file="${i}">
          <button class="mini-btn" type="button" data-sign-remove="${i}">ลบ</button>
        </div>
      </div>
    `;
    wrap.appendChild(fg);
  });

  wrap.querySelectorAll('[data-sign-file]').forEach(inp => {
    inp.addEventListener('change', async (e) => {
      const idx = parseInt(inp.dataset.signFile, 10);
      const file = e.target.files[0];
      if(!file) return;
      const statusEl = document.getElementById('statusMsg');
      statusEl.textContent = 'กำลังประมวลผลรูป...';
      try{
        const dataUrl = await fileToDataUrl(file, 200, 0.85);
        signs[idx].image = dataUrl;
        wrap.querySelector(`[data-thumb="${idx}"]`).src = dataUrl;
        wrap.querySelector(`[data-thumb="${idx}"]`).style.display = 'block';
        wrap.querySelector(`[data-thumb-empty="${idx}"]`).style.display = 'none';
        statusEl.textContent = 'เลือกรูปแล้ว — กด "บันทึก" เพื่อเก็บถาวร';
      }catch(err){
        statusEl.textContent = 'อัปโหลดรูปไม่สำเร็จ: ' + (err && err.message ? err.message : 'ไม่ทราบสาเหตุ');
      }
    });
  });
  wrap.querySelectorAll('[data-sign-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.signRemove, 10);
      signs[idx].image = null;
      wrap.querySelector(`[data-thumb="${idx}"]`).style.display = 'none';
      wrap.querySelector(`[data-thumb-empty="${idx}"]`).style.display = 'flex';
    });
  });
}

async function loadSigns(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.signs) && parsed.signs.length === 6){
        signs = parsed.signs.map(s => ({ label: s.label || '', url: s.url || '', image: s.image || null }));
      }
      if(parsed && parsed.settings){
        settings = {...DEFAULT_SETTINGS, ...parsed.settings};
      }
    }
  }catch(e){
    // no saved data yet, or storage unavailable — keep defaults
  }
  applySettings();
  renderSigns();
  renderFields();
  fillStyleInputs();
}

async function saveSigns(){
  const inputs = document.querySelectorAll('#fields input[type="text"]');
  inputs.forEach(inp => {
    const idx = parseInt(inp.dataset.idx, 10);
    const field = inp.dataset.field;
    signs[idx][field] = inp.value;
  });
  settings.title = document.getElementById('titleInput').value.trim() || DEFAULT_SETTINGS.title;
  settings.subtitle = document.getElementById('subtitleInput').value.trim() || DEFAULT_SETTINGS.subtitle;
  settings.shape = document.getElementById('shapeSelect').value;
  settings.bgTop = document.getElementById('colorBgTop').value;
  settings.bgBot = document.getElementById('colorBgBot').value;
  settings.sign = document.getElementById('colorSign').value;
  settings.text = document.getElementById('colorText').value;
  settings.accent = document.getElementById('colorAccent').value;

  const newPass = document.getElementById('newPassword').value.trim();
  if(newPass){
    settings.password = newPass;
  }

  const statusEl = document.getElementById('statusMsg');
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ signs, settings }));
    statusEl.textContent = 'บันทึกแล้ว ✓';
    applySettings();
    renderSigns();
    document.getElementById('newPassword').value = '';
    setTimeout(()=> statusEl.textContent = '', 2000);
  }catch(e){
    if(e && e.name === 'QuotaExceededError'){
      statusEl.textContent = 'รูปใหญ่เกินไป ลองใช้รูปที่เล็กลง';
    }else{
      statusEl.textContent = 'เกิดข้อผิดพลาดในการบันทึก';
    }
  }
}

/* --- background image upload (admin panel) --- */
document.getElementById('bgFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('statusMsg');
  statusEl.textContent = 'กำลังประมวลผลรูป...';
  try{
    settings.bgImage = await fileToDataUrl(file, 1600, 0.75);
    refreshBgThumb();
    applySettings();
    statusEl.textContent = 'เลือกรูปแล้ว — กด "บันทึก" เพื่อเก็บถาวร';
  }catch(err){
    statusEl.textContent = 'อัปโหลดพื้นหลังไม่สำเร็จ: ' + (err && err.message ? err.message : 'ไม่ทราบสาเหตุ');
  }
});
document.getElementById('bgRemoveBtn').addEventListener('click', () => {
  settings.bgImage = null;
  refreshBgThumb();
  applySettings();
  document.getElementById('statusMsg').textContent = 'ลบรูปพื้นหลังแล้ว — กด "บันทึก" เพื่อยืนยัน';
});

/* --- password lock --- */
function showLock(){
  document.getElementById('lockInput').value = '';
  document.getElementById('lockErr').textContent = '';
  document.getElementById('lockOverlay').classList.add('show');
  setTimeout(() => document.getElementById('lockInput').focus(), 50);
}
function tryUnlock(){
  const val = document.getElementById('lockInput').value;
  if(val === settings.password){
    unlocked = true;
    document.getElementById('lockOverlay').classList.remove('show');
    renderFields();
    fillStyleInputs();
    document.getElementById('overlay').classList.add('show');
  }else{
    document.getElementById('lockErr').textContent = 'รหัสผ่านไม่ถูกต้อง';
  }
}

document.getElementById('openAdmin').addEventListener('click', showLock);
document.getElementById('lockCancel').addEventListener('click', () => {
  document.getElementById('lockOverlay').classList.remove('show');
});
document.getElementById('lockSubmit').addEventListener('click', tryUnlock);
document.getElementById('lockInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') tryUnlock();
});
document.getElementById('lockOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'lockOverlay') document.getElementById('lockOverlay').classList.remove('show');
});

document.getElementById('closeAdmin').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
});
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') document.getElementById('overlay').classList.remove('show');
});
document.getElementById('saveAdmin').addEventListener('click', saveSigns);

makeStars();
loadSigns();
</script>
